services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: knowledge_graph
      POSTGRES_USER: knowledge_graph
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_graph -d knowledge_graph"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
