name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_LANDING_ONLY: "true"
  NEXT_PUBLIC_BASE_PATH: /knowledge-graph
  NEXT_PUBLIC_SITE_URL: https://denniedan.github.io/knowledge-graph

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: apps/web
      - name: Serve the landing page at the site root
        working-directory: apps/web/out
        run: |
          rm -f index.txt __next.*.txt
          cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Canon</title>
          <link rel="icon" href="./favicon.ico">
          <meta http-equiv="refresh" content="0; url=./landing/">
          <link rel="canonical" href="https://denniedan.github.io/knowledge-graph/landing/">
          <a href="./landing/">Continue to the Canon landing page</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
